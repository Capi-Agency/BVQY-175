user nginx;
worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    client_max_body_size 30M;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:
    ECDHE-RSA-AES128-GCM-SHA256:
    ECDHE-ECDSA-AES256-GCM-SHA384:
    ECDHE-RSA-AES256-GCM-SHA384:
    ECDHE-ECDSA-CHACHA20-POLY1305:
    ECDHE-RSA-CHACHA20-POLY1305';

    # =========================
    # LOG
    # =========================
    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status '
        'reqlen=$request_length bytes_sent=$body_bytes_sent '
        'rt=$request_time '
        'urt=$upstream_response_time '
        'uaddr=$upstream_addr '
        'ustatus=$upstream_status '
        'host="$host" '
        'xff="$http_x_forwarded_for" '
        'ref="$http_referer" '
        'ua="$http_user_agent" '
        'args="$args" '
        'reqid=$request_id';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    upstream nextjs_app {
        least_conn;
        server website_nginx:80;
        keepalive 64;
    }

    upstream swagger_ui {
        least_conn;
        server core_swagger:80;
        keepalive 64;
    }

    upstream directus_cms {
        least_conn;
        server core_cms:8055;
        keepalive 64;
    }

    # =========================
    # REDIRECT: www -> non-www
    # =========================
    server {
        listen 80;
        server_name www.benhvien175.vn;
        return 301 https://benhvien175.vn$request_uri;
    }

    # =========================
    # MAIN SERVER
    # =========================
    server {
        listen 80;
        server_name benhvien175.vn;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        # add_header X-Frame-Options "SAMEORIGIN" always;
        # add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "child-src 'self' blob: https://www.youtube.com https://youtube-nocookie.com https://www.youtube-nocookie.com https://www.google.com https://app.mappedin.com; frame-src 'self' https://www.youtube.com https://youtube-nocookie.com https://www.youtube-nocookie.com https://www.google.com https://app.mappedin.com;";
        
        location ~* \.php { return 403; }

        location /cms/api-docs/ {
            proxy_pass http://swagger_ui/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /cms/ {
            proxy_pass http://directus_cms/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://nextjs_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}